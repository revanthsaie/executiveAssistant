# Builds the Windows desktop app on a GitHub-hosted Windows machine.
# - Manual run (Actions tab → "Build Windows app" → Run workflow): zip is attached to the run as an artifact.
# - Pushing a tag like v0.1.0: the zip is also published as a GitHub Release you can download.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build React UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build .exe with PyInstaller
        run: pyinstaller executive_assistant.spec --noconfirm

      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path dist/ExecutiveAssistant -DestinationPath ExecutiveAssistant-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ExecutiveAssistant-windows
          path: ExecutiveAssistant-windows.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ExecutiveAssistant-windows.zip --title "${{ github.ref_name }}" --generate-notes
